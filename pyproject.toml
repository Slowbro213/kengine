[project]
name = "kengine"
version = "0.1.0"
description = "An agent harness that checks a small local model's reasoning as claims"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "z3-solver>=4.13",
]

[project.optional-dependencies]
eval = ["datasets>=2.19"]

[project.scripts]
kengine = "kengine.cli.main:app"

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1.380", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kengine"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["llm: needs a real llama-server (KENGINE_TEST_LLM_URL)"]
addopts = "-m 'not llm' --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff.format]
exclude = ["docs/**"]
